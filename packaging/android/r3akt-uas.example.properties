# Example R3AKT UAS settings. No credentials: hub identity and playback access
# are resolved at runtime through RCH authorization (UAS-VID-002, UAS-VID-007).
# The scaffold reads none of these; publication is off by default (UAS-SCF-005).
publication.enabled=false
hub.destination=
interface.tcp.host=
interface.tcp.port=4242
interface.rnode.enabled=false
telemetry.flight_hz=1.0
telemetry.max_hz=2.0
telemetry.stationary_hz=0.2
video.enabled=false
