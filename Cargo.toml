[workspace]
members = ["crates/r3akt-uas-app", "tools/uas-sim", "tools/uniffi-bindgen"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "EPL-2.0"
repository = "https://github.com/FreeTAKTeam/r3akt-uas"
publish = false

# Shared R3AKT libraries, pinned to the inspected baselines in docs/goals/bootstrap/PLAN.md.
# Do not replace these with local implementations (see AGENTS.md).
[workspace.dependencies]
r3akt-map-core = { git = "https://github.com/FreeTAKTeam/Reticulum-Community-Hub.git", rev = "83b5d64aac69347c997ac9e88d84242eb87a1814" }
# Milestone 2a publication path, used only behind r3akt-uas-app's `publish` feature.
# One LXMF-rs revision: the one RCH 83b5d64a pins (D-5, re-pinned for operator markers, D-13).
r3akt-profile-rch = { git = "https://github.com/FreeTAKTeam/Reticulum-Community-Hub.git", rev = "83b5d64aac69347c997ac9e88d84242eb87a1814" }
lxmf-sdk = { git = "https://github.com/FreeTAKTeam/LXMF-rs.git", rev = "9b972f9a8d3a7949eae89bc78f7a9691f06f3ed1", default-features = false, features = ["std"] }
lxmf-runtime = { git = "https://github.com/FreeTAKTeam/LXMF-rs.git", rev = "9b972f9a8d3a7949eae89bc78f7a9691f06f3ed1" }
reticulum-rs-transport = { git = "https://github.com/FreeTAKTeam/LXMF-rs.git", rev = "9b972f9a8d3a7949eae89bc78f7a9691f06f3ed1" }
reticulum-rs-core = { git = "https://github.com/FreeTAKTeam/LXMF-rs.git", rev = "9b972f9a8d3a7949eae89bc78f7a9691f06f3ed1" }
# Operator markers (D-12): store types of the LXMF-rs custody outbox.
lxmf-propagation = { git = "https://github.com/FreeTAKTeam/LXMF-rs.git", rev = "9b972f9a8d3a7949eae89bc78f7a9691f06f3ed1", features = ["embedded"] }
# Local list of own markers in the shared map-core marker store (its Connection type).
rusqlite = "0.41"
tokio = { version = "1", features = ["rt-multi-thread"] }
base64 = "0.22"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = "=0.28.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
