name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-docs-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/check.sh

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the obsolete "tools" package, which sdkmanager no longer serves.
          packages: platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build simulator and DJI 4 variants
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleSimDebug :app:assembleDji4Debug
      - name: Simulator APK must not contain the DJI SDK
        run: |
          set -euo pipefail
          apk=apps/android/app/build/outputs/apk/sim/debug/app-sim-debug.apk
          test -f "$apk"
          ! unzip -l "$apk" | grep -i dji
      - name: Default variants must not contain the RCH publisher (UAS-SCF-005, D-4)
        run: |
          set -euo pipefail
          # Explicit exits: `set -e` ignores a failing `! command`.
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/35*/aapt2 | tail -1)
          for apk in apps/android/app/build/outputs/apk/{sim,dji4}/debug/app-*-debug.apk; do
            for lib in $(unzip -Z1 "$apk" 'lib/*/libr3akt_uas_app.so'); do
              # grep -c reads to the end: with pipefail, grep -q would kill unzip with SIGPIPE.
              if unzip -p "$apk" "$lib" | grep -acE "uniffi_r3akt_uas_app_fn_func_(publish|marker)_" >/dev/null; then
                echo "$apk $lib contains the publisher" >&2; exit 1
              fi
            done
          done
          if "$aapt2" dump permissions apps/android/app/build/outputs/apk/sim/debug/app-sim-debug.apk | grep -c android.permission.INTERNET >/dev/null; then
            echo "sim APK requests INTERNET" >&2; exit 1
          fi
